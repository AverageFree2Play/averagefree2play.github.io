<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website - Home</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="shortcut icon" type="image/x-icon" href="icons/favicon.png">
    <script src="js/ui.js" defer></script>
</head>
<body>

<div class="win-app-container">

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="menu-btn" id="toggle-btn" title="Navigation Menu">
                <img src="icons/hamburger.svg" alt="Menu" class="icon-img">
            </button>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" title="Home">
                <span class="nav-icon">
                    <img src="icons/home.svg" alt="Home" class="icon-img">
                </span>
                <span class="nav-label">Home</span>
            </a>

            <a href="#" class="nav-item" title="About">
                <span class="nav-icon">
                    <img src="icons/info.svg" alt="About" class="icon-img">
                </span>
                <span class="nav-label">About</span>
            </a>

            <a href="#" class="nav-item" title="FAQ">
                <span class="nav-icon">
                    <img src="icons/question.svg" alt="FAQ" class="icon-img">
                </span>
                <span class="nav-label">FAQ</span>
            </a>

            <a href="#" class="nav-item" title="Contact">
                <span class="nav-icon">
                    <img src="icons/chat.svg" alt="Contact" class="icon-img">
                </span>
                <span class="nav-label">Contact</span>
            </a>

            <a href="#" class="nav-item" title="Extras">
                <span class="nav-icon">
                    <img src="icons/script.svg" alt="Extras" class="icon-img">
                </span>
                <span class="nav-label">Extras</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content Panel -->
    <main class="main-content">
        <h1 class="page-title">Home</h1>
        <div class="settings-group">
            <div class="expandable-item">
                <div class="setting-row js-expand-trigger">
                    <div class="setting-icon">
                        <img src="icons/question.svg" alt="Help" class="icon-img">
                    </div>
                    <div class="setting-details">
                        <div class="setting-title">Help</div>
                        <div class="setting-description">Don't know what to do? Click me!</div>
                    </div>
                    <div class="chevron">
                        <img src="icons/chevron.svg" alt="Expand" class="icon-img">
                    </div>
                </div>
                <div class="sub-menu">
                    <div class="sub-row">
                        <div class="setting-details">
                            <div class="setting-title">Welcome to my site!</div>
                            <div class="setting-description">To get started, click the hamburger menu on the top left to reveal the navigation menu. From there, you can navigate to different sections of the site.</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</div>

<script>
</script>

</body>
</html>
